<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMOOSHIK | Modern Cat Wall Shelves</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fdfcfb;
            --text-main: #1e1b18;
            --text-muted: #6b645f;
            --accent: #8c7662;
            --white: #ffffff;
            --card-border: #eae6e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Header / Logo */
        header {
            background-color: var(--white);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
        }

        /* Main Product Container */
        .product-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .product-container {
                grid-template-columns: 1fr;
                gap: 30px;
                margin: 20px auto;
            }
        }

        /* Left Side: Image Area */
        .image-gallery {
            width: 100%;
            display: flex;
            justify-content: center;
            background-color: var(--white);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .image-gallery img {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            transition: opacity 0.2s ease;
        }

        /* Right Side: Details & Swatches */
        .product-details {
            display: flex;
            flex-direction: column;
        }

        .tagline {
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .title {
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .swatch-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .swatches-container {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .swatch {
            padding: 10px 20px;
            border: 2px solid var(--card-border);
            background-color: var(--white);
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
