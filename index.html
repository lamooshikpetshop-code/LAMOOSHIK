<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMOOSHIK | Premium Cat Furniture</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fcfbfa;
            --text-main: #2d2b2a;
            --text-muted: #6e6a68;
            --accent: #8c7662;
            --accent-hover: #735f4e;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .divider {
            height: 1px;
            width: 60px;
            background-color: var(--accent);
            margin: 0 auto 30px auto;
        }

        .status-badge {
            display: inline-block;
            background-color: #f3ebe3;
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LAMOOSHIK</h1>
        <p class="subtitle">Premium Cat Furniture & Design</p>
        
        <div class="divider"></div>
        
        <div class="status-badge">האתר הרשמי בבנייה • בקרוב כאן</div>
        
        <p style="color: var(--text-main); font-size: 1.1rem;">אנחנו מכינים לחתול שלכם משהו מיוחד באמת.</p>
        
        <div class="footer">
            &copy; 2026 LAMOOSHIK. All rights reserved.
        </div>
    </div>

</body>
</html>
